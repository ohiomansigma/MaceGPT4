<!DOCTYPE html>
<html>
<head>
    <title>MaceBot</title>
    <style>
        * {
            color: #ffffff !important;
        }
        body {
            background: #111;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }
        input {
            width: 60%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            color: black !important;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #444;
            cursor: pointer;
        }
        button:hover {
            background: #555;
        }
        .answer {
            margin-top: 40px;
            font-size: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>🦍 About The Ancient: MaceGPT 🔥</h1>

    <form method="POST">
        <input type="text" name="question" placeholder="Ask anything..." required>
        <br>
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
        <div class="answer">
            <h2>Answer:</h2>
            {{ answer }}
        </div>
    {% endif %}

</body>
</html>
